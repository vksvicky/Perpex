<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perpex Watch Face - Visual Showcase & Metric Reference</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Perpex Tactical Watch Face</h1>
    <p class="lead">Interactive Visual Showcase demonstrating all 27 customizable metrics across 6 slots, dynamic weather conditions, themes, and AMOLED Always-On Display mode.</p>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All Showcase Views</button>
      <button class="filter-btn" data-filter="metrics">Core Metrics</button>
      <button class="filter-btn" data-filter="weather">Live Weather</button>
      <button class="filter-btn" data-filter="themes">Color Themes</button>
      <button class="filter-btn" data-filter="night">Night Mode</button>
      <button class="filter-btn" data-filter="aod">AMOLED AOD</button>
    </div>
  </header>

  <main>
    <div class="grid" id="cards-grid">
      <!-- Dynamically rendered by app.js from cards_data.js -->
    </div>
  </main>

  <script src="cards_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
